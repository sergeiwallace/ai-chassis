[pytest]
# The package's own suite LOADS the plugin. Its managed-spawn tests need the
# `managed_run` and `detached_payload` fixtures and the supervisor lease, all of
# which come from it. This file is the config pytest picks for any run whose paths
# all sit under this package (the push gate's diff-selected tiers do exactly that),
# so a `-p no:fleet_testkit` here failed every such test with "fixture 'managed_run'
# not found" while the whole-repo suite, under the root config, passed them.
# Behaviours of a whole pytest run (worker death, controller death, a red result)
# are still exercised in nested runs, which pass their own `-p` flags.
addopts = -p no:cacheprovider -p fleet_testkit
testpaths = tests
# The repository root, as the root config's `pythonpath = ["."]` gives it: a package test
# imports the repo's `tests._canonical_registry_fixture`, and without this a package-only
# run (pytest picks this file) failed to collect it with "No module named 'tests'".
pythonpath = ../..
