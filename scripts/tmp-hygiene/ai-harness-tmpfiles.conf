# Root-owned backstop for scratch directories that can survive killed test runs.
# `e` never creates paths; systemd-tmpfiles-clean removes only aged contents.
e /tmp/pytest-of-* - - - 24h
e /tmp/example-project-*-cache - - - 24h
e /tmp/example-project-*-venv* - - - 24h
e /tmp/example-project-pg-sock-* - - - 24h
e /tmp/aih-*-test-venv - - - 24h
