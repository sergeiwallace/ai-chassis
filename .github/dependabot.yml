# Version-update pull requests are off. This repository is a generated extract of its
# source, so a direct merge here makes the tree diverge from the source and the next
# release would overwrite it. Dependency pins and action versions are refreshed in the
# source once per release. Dependabot alerts and security updates stay on in the
# repository settings; a security pull request is carried into the source the same way.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
