name: Publication security scan

# Run on demand: this workflow does not run on push or pull request.
on:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan working tree and every ref
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.0 \
            dir --source=/repo --config=/repo/.gitleaks.toml --redact=100
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks:v8.30.0 \
            git --source=/repo --config=/repo/.gitleaks.toml --redact=100 --log-opts="--all"
