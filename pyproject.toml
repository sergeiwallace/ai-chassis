[project]
name = "ai-chassis"
version = "0.1.0"
description = "Reusable source tools and templates for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "jsonschema>=4.18",
  "psutil>=7.2.2",
  "pytest>=8",
  "pytest-xdist>=3",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
pythonpath = [".", "src", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "PLR", "ERA", "ARG", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 10
