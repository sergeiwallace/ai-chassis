<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}{% if page.title != site.title %} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description | strip | escape }}">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
      --code-bg: #f6f8fa; --link: #0969da; --accent: #8250df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
        --code-bg: #151b23; --link: #4493f8; --accent: #ab7df8;
      }
    }
    html { background: var(--bg); }
    body {
      margin: 0; color: var(--fg); background: var(--bg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1, h2, h3 { line-height: 1.25; }
    h2 { margin-top: 2.2rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
    a { color: var(--link); }
    img { max-width: 100%; }
    blockquote {
      margin: 1rem 0; padding: .1rem 1rem; color: var(--muted);
      border-left: 4px solid var(--accent);
    }
    code, pre { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    code { background: var(--code-bg); padding: .15em .35em; border-radius: 4px; }
    pre { background: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
    th, td { border: 1px solid var(--line); padding: .4rem .7rem; vertical-align: top; }
    th { background: var(--code-bg); text-align: left; }
    pre.mermaid { background: none; text-align: center; padding: 0; }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
  <!-- Diagrams. The README writes them as mermaid code blocks, which GitHub renders itself.
       Here a pinned copy of mermaid draws them; without it the blocks stay readable as text. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I" crossorigin="anonymous"></script>
  <script>
    (function () {
      if (!window.mermaid) { return; }
      var blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
      var diagrams = [];
      blocks.forEach(function (block) {
        var source = block.textContent;
        var holder = block.tagName === "CODE" ? block.parentNode : block;
        var pre = document.createElement("pre");
        pre.className = "mermaid";
        pre.textContent = source;
        holder.parentNode.replaceChild(pre, holder);
        diagrams.push(pre);
      });
      if (!diagrams.length) { return; }
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      window.mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
      window.mermaid.run({ nodes: diagrams });
    })();
  </script>
</body>
</html>
